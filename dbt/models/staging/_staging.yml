version: 2

# Every staging model has the same shape and the same tests, so the three
# systems can be stacked into one table downstream.

models:
  - name: stg_system_a__appointments
    description: System A (EHR) appointments in the shared shape, one row per appointment.
    columns: &staging_columns
      - name: appointment_id
        data_tests: [unique, not_null]
      - name: appointment_date
        data_tests: [not_null]
      - name: scheduled_at
        data_tests: [not_null]
      - name: visit_status
        data_tests:
          - accepted_values:
              arguments:
                values: ["arrived", "no_show", "unmapped"]
      - name: patient_age
        description: >
          Ages outside 0-115 are kept as-is and surfaced as a warning so the
          clinic can fix them at the source. (The source data has one negative
          age; it lands in System C.)
        data_tests:
          - valid_age:
              config:
                severity: warn

  - name: stg_system_b__appointments
    description: >
      System B (front-desk software) appointments, deduplicated to one row per
      appointment, with free-text statuses mapped to the standard set.
    columns: *staging_columns

  - name: stg_system_c__appointments
    description: System C (legacy) appointments in the shared shape.
    columns: *staging_columns
